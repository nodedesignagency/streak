# XcodeGen spec for the demo app. The generated StreakDemo.xcodeproj is committed, so you only need
# XcodeGen (`brew install xcodegen`, then `xcodegen` in this folder) if you change this file.
name: StreakDemo
options:
  bundleIdPrefix: com.nodedesign
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  StreakCelebration:
    path: ..
targets:
  StreakDemo:
    type: application
    platform: iOS
    sources:
      - StreakDemo
    dependencies:
      - package: StreakCelebration
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nodedesign.StreakDemo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Streak
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
